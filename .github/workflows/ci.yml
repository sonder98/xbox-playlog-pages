name: Verify Playlog changes
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Verify desktop and mobile navigation and Mythic cover geometry
        run: node --experimental-strip-types scripts/check-navigation.mjs
      - name: Check release publishing script syntax without credentials
        run: node --check scripts/live-assets.mjs
