name: Deploy Playlog
run-name: Playlog deploy (${{ github.event_name }} · ${{ inputs.request_id }})
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/sync.yml'
      - 'src/**'
      - 'scripts/**'
      # Xbox-only backend changes already run sync.yml, which dispatches Pages on success.
      - '!scripts/microsoft-*.ts'
      - 'data/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      data_only:
        type: boolean
        default: false
        description: Reuse the tested frontend package
      request_id:
        description: 'Optional originating manual sync request ID'
        required: false
        type: string
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: playlog-live-publish
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: inputs.data_only != true
        run: npm ci --ignore-scripts
      # Browser E2E checks run in ci.yml on every PR; hourly data publication
      # must not be blocked by date-sensitive UI test fixtures.
      - name: Restore public artwork cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: artwork-webp-v1-${{ runner.os }}-
      - name: Restore legacy encrypted checkpoint (one-time compatibility)
        id: legacy_checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            public/vault.json
            public/status.json
          key: playlog-encrypted-vault-v1-main-${{ github.run_id }}
          restore-keys: playlog-encrypted-vault-v1-main-
      - name: Stage legacy checkpoint if found
        if: steps.legacy_checkpoint.outputs.cache-matched-key != ''
        run: |
          mkdir -p .snapshot-backup-legacy
          cp public/vault.json public/status.json .snapshot-backup-legacy/
      - name: Restore independent encrypted checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .snapshot-backup
          key: playlog-checkpoint-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: playlog-checkpoint-v2-
      - name: Restore newest encrypted snapshot and verify durable media coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live-assets.mjs restore-snapshot
      - name: Restore best available artwork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs restore-media
      - name: Validate and package changed frontend
        if: inputs.data_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm test
          npm run build
          node scripts/pages-shell.mjs save
      - name: Assemble hourly site from verified frontend and fresh snapshot
        if: inputs.data_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pages-shell.mjs restore
          cp public/{vault,status}.json dist/
          if [ -d public/media ]; then cp -a public/media dist/; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub's artifact upload can finish before deploy-pages can see it via
      # the Actions artifacts API. Verify indexing before starting deployment.
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact indexed (attempt $attempt)"
              sleep 10
              exit 0
            fi
            echo "Waiting for Pages artifact to appear in Actions API ($attempt/24)"
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact is not visible to deployment"
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published snapshot
        run: |
          expected=$(jq -r .vaultSha256 dist/status.json)
          for attempt in $(seq 1 12); do
            actual=$(curl -fsS --max-time 12 "https://sonder98.github.io/xbox-playlog-pages/status.json?verify=$GITHUB_RUN_ID-$attempt" | jq -r .vaultSha256) || actual=''
            if [ -n "$expected" ] && [ "$expected" != null ] && [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 5
          done
          exit 1
