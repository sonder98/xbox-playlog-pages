name: Deploy Playlog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/sync.yml'
      - 'src/**'
      - 'scripts/**'
      - 'data/**'
      - 'public/vault.json'
      - 'public/status.json'
      - 'public/catalog-export.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: playlog-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - name: Restore public artwork cache
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: artwork-webp-v1-${{ runner.os }}-
      - run: npm test
      - run: npm run build
      - name: Check mobile and desktop page navigation
        run: node --experimental-strip-types scripts/check-navigation.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
