name: Publish and sync Playlog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'data/**'
      - 'public/catalog-export.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      sync:
        description: 同步 Exophase 公开档案（只需 APP_PASSWORD）
        type: boolean
        default: true
  schedule:
    # Daily at 08:17 China Standard Time; avoid the busy top of the hour.
    - cron: '17 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - name: Sync and encrypt Exophase records
        id: exophase_sync
        continue-on-error: true
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sync) || github.event_name == 'schedule'
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NEW_APP_PASSWORD: ${{ secrets.NEW_APP_PASSWORD }}
        run: xvfb-run --auto-servernum npm run sync
      - name: Save only encrypted snapshots
        if: steps.exophase_sync.outcome == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sync) || github.event_name == 'schedule')
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/vault.json public/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Exophase snapshot"
            git push origin HEAD:main
          fi
      - run: npm test
      - run: npm run build
      - name: Check mobile and desktop page navigation
        run: node --experimental-strip-types scripts/check-navigation.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unsuccessful sync after publishing
        if: steps.exophase_sync.outcome == 'failure'
        run: |
          echo "Exophase sync failed; the site was published with the last successful snapshot." >> "$GITHUB_STEP_SUMMARY"
          exit 1
