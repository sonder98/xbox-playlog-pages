name: Publish and sync Playlog
on:
  push:
    branches: [main]
    paths-ignore:
      - public/vault.json
      - public/status.json
  workflow_dispatch:
    inputs:
      sync:
        description: 同步 Xbox 数据（需先设置两个 Secrets）
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Sync and encrypt own Xbox records
        if: github.event_name == 'workflow_dispatch' && inputs.sync
        env:
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: npm run sync
      - name: Save only encrypted snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/vault.json public/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Xbox snapshot"
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
