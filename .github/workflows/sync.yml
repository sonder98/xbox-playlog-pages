name: Sync Xbox records
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: xbox-record-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate before contacting Xbox
        run: |
          npm test
          npx tsc --noEmit
      - name: Restore public artwork cache
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: artwork-webp-v1-${{ runner.os }}-
      - name: Restore encrypted Microsoft authorization
        uses: actions/cache/restore@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-start
          restore-keys: microsoft-private-v1-main-
      - name: Sync and encrypt Microsoft records
        id: microsoft_sync
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NEW_APP_PASSWORD: ${{ secrets.NEW_APP_PASSWORD }}
          MICROSOFT_STATE_KEY: ${{ secrets.MICROSOFT_STATE_KEY }}
        run: node --experimental-strip-types scripts/microsoft-sync.ts
      - name: Save encrypted Microsoft authorization
        if: steps.microsoft_sync.outcome == 'success' || steps.microsoft_sync.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-end
      - name: Save public artwork cache before deploying
        uses: actions/cache/save@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Publish encrypted snapshot and trigger Pages
        run: |
          cp public/vault.json "$RUNNER_TEMP/vault.json"
          cp public/status.json "$RUNNER_TEMP/status.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/vault.json" public/vault.json
            cp "$RUNNER_TEMP/status.json" public/status.json
            git add public/vault.json public/status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update encrypted Microsoft snapshot"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish encrypted snapshot after three attempts" >&2
              exit 1
            fi
          done

      - name: Trigger Pages explicitly (bot pushes do not start push workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
