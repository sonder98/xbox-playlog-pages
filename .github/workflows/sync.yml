name: Sync Xbox records
run-name: Xbox sync (${{ github.event_name }} · ${{ inputs.request_id }})
# Hourly and day-boundary cron events are dispatched by Cloudflare Worker.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional manual sync request ID'
        required: false
        type: string
      force_sweep:
        description: 'External scheduler: capture an exact day-boundary playtime checkpoint'
        required: false
        default: 'false'
        type: string
      sync_mechanism:
        description: 'Source: manual, cloudflare or day-boundary; GitHub UI manual runs should enter manual'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/microsoft-*.ts'
      - 'scripts/microsoft.ts'
      - 'scripts/image-cache.ts'
      - 'scripts/snapshot.ts'
      - 'scripts/live-assets.mjs'
      - 'scripts/sync-health.ts'
      - 'src/playtime-ledger.ts'
      - 'src/crypto.ts'
      - 'scripts/password.ts'
      # Schema changes (including posterSelectionVersion) must update the
      # encrypted live Release as well as the static frontend.
      - 'src/data.ts'
permissions:
  contents: write
  actions: write
concurrency:
  group: playlog-live-publish
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore public artwork cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: artwork-webp-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            artwork-webp-v2-${{ runner.os }}-
            artwork-webp-v1-${{ runner.os }}-
      - name: Restore encrypted Microsoft authorization
        uses: actions/cache/restore@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-start
          restore-keys: microsoft-private-v1-main-
      - name: Restore legacy encrypted checkpoint (one-time compatibility)
        id: legacy_checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            public/vault.json
            public/status.json
          key: playlog-encrypted-vault-v1-main-${{ github.run_id }}
          restore-keys: playlog-encrypted-vault-v1-main-
      - name: Stage legacy checkpoint if found
        if: steps.legacy_checkpoint.outputs.cache-matched-key != ''
        run: |
          mkdir -p .snapshot-backup-legacy
          cp public/vault.json public/status.json .snapshot-backup-legacy/
      - name: Restore independent encrypted checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .snapshot-backup
          key: playlog-checkpoint-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: playlog-checkpoint-v2-
      - name: Restore newest encrypted snapshot and verify durable media coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live-assets.mjs restore-snapshot
      - name: Recover artwork when available
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs restore-media
      # Older deployed Cloudflare Workers omit sync_mechanism. Unlabelled
      # dispatches without a manual request_id are Cloudflare's hourly ticks.
      # GitHub UI manual runs must explicitly select sync_mechanism=manual.
      - name: Sync and encrypt Microsoft records
        id: microsoft_sync
        env:
          PLAYLOG_VAULT_FORMAT: '2'
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NEW_APP_PASSWORD: ${{ secrets.NEW_APP_PASSWORD }}
          MICROSOFT_STATE_KEY: ${{ secrets.MICROSOFT_STATE_KEY }}
          PLAYTIME_FORCE_SWEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_sweep == 'true' }}
          PLAYLOG_SYNC_MECHANISM: ${{ github.event_name == 'push' && 'code-update' || inputs.sync_mechanism == 'manual' && 'manual' || inputs.sync_mechanism == 'cloudflare' && 'cloudflare' || inputs.sync_mechanism == 'day-boundary' && 'day-boundary' || inputs.request_id != '' && 'manual' || inputs.force_sweep == 'true' && 'day-boundary' || 'cloudflare' }}
        run: node --experimental-strip-types scripts/microsoft-sync.ts
      - name: Save encrypted Microsoft authorization
        if: steps.microsoft_sync.outcome == 'success' || steps.microsoft_sync.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-end
      - name: Save public artwork cache before deploying
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: public/media
          key: artwork-webp-v2-${{ runner.os }}-${{ github.run_id }}
      # Keep the latest encrypted snapshot independent of GitHub Releases.
      # A failed --clobber upload must not destroy the only current copy.
      - name: Prepare independent encrypted checkpoint
        run: |
          mkdir -p .snapshot-backup
          cp public/vault.json public/status.json .snapshot-backup/
      - name: Preserve encrypted snapshot backup before Release upload
        uses: actions/cache/save@v4
        with:
          path: .snapshot-backup
          key: playlog-checkpoint-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish and verify encrypted snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs publish

      - name: Trigger Pages explicitly (bot pushes do not start push workflows)
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
        run: gh workflow run pages.yml --ref main -f data_only=true -f request_id="$SYNC_REQUEST_ID"

      - name: Archive artwork separately
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs publish-media

      # Optional mirror: GitHub Release and Pages remain the production fallback.
      - name: Publish encrypted snapshot to EdgeOne Blob
        if: ${{ env.EDGEONE_API_TOKEN != '' && env.EDGEONE_PROJECT_ID != '' }}
        continue-on-error: true
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ secrets.EDGEONE_PROJECT_ID }}
        run: |
          npm install --no-save --ignore-scripts @edgeone/pages-blob@0.0.18
          node scripts/edgeone-blob.mjs publish
