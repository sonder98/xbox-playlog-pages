name: Sync Xbox records
run-name: Xbox sync (${{ github.event_name }} · ${{ inputs.request_id }})
on:
  schedule:
    # Re-register schedule after missing 3 consecutive fires. GitHub cron is best-effort.
    # Normal half-hour sync, excluding Beijing 23:xx for day-end checkpoint.
    - cron: '17,47 0-14,16-23 * * *'
    # Asia/Shanghai 23:42 (15:42 UTC): capture a day-end cumulative-minute checkpoint.
    - cron: '42 15 * * *'
    # Asia/Shanghai 00:02 (16:02 UTC): capture next day's baseline.
    - cron: '2 16 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional manual sync request ID'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/microsoft-*.ts'
      - 'scripts/image-cache.ts'
      - 'scripts/snapshot.ts'
      - 'scripts/password.ts'
permissions:
  contents: write
  actions: write
concurrency:
  group: playlog-live-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts playwright
      - name: Validate before contacting Xbox
        run: |
          npm test
          npx tsc --noEmit
      - name: Restore public artwork cache
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: artwork-webp-v1-${{ runner.os }}-
      - name: Restore encrypted Microsoft authorization
        uses: actions/cache/restore@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-start
          restore-keys: microsoft-private-v1-main-
      - name: Restore newest published encrypted snapshot and durable artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live-assets.mjs restore-snapshot
          node scripts/live-assets.mjs restore-media
      - name: Sync and encrypt Microsoft records
        id: microsoft_sync
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NEW_APP_PASSWORD: ${{ secrets.NEW_APP_PASSWORD }}
          MICROSOFT_STATE_KEY: ${{ secrets.MICROSOFT_STATE_KEY }}
          PLAYTIME_FORCE_SWEEP: ${{ github.event_name == 'schedule' && (github.event.schedule == '42 15 * * *' || github.event.schedule == '2 16 * * *') }}
        run: node --experimental-strip-types scripts/microsoft-sync.ts
      - name: Save encrypted Microsoft authorization
        if: steps.microsoft_sync.outcome == 'success' || steps.microsoft_sync.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-sync-end
      - name: Save public artwork cache before deploying
        uses: actions/cache/save@v4
        with:
          path: public/media
          key: artwork-webp-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Publish encrypted snapshot and durable artwork without Git commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs publish

      - name: Trigger Pages explicitly (bot pushes do not start push workflows)
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
        run: gh workflow run pages.yml --ref main -f request_id="$SYNC_REQUEST_ID"
