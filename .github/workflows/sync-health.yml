name: Monitor Playlog sync health
on:
  schedule:
    - cron: '37 * * * *'
  workflow_run:
    workflows: [Deploy Playlog, Sync Xbox records]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: playlog-health-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actually published data and boundary coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS' > /tmp/playlog-health.json
          import fs from 'node:fs';
          import {syncHealth} from './scripts/sync-health.ts';
          let status=null;
          try{
            const response=await fetch('https://sonder98.github.io/xbox-playlog-pages/status.json?health='+Date.now(),{signal:AbortSignal.timeout(20000),cache:'no-store'});
            if(response.ok)status=await response.json();
          }catch{}
          fs.writeFileSync('/tmp/playlog-published.json',JSON.stringify(status));
          console.log(JSON.stringify(syncHealth(status)));
          JS
          level=$(jq -r .level /tmp/playlog-health.json)
          message=$(jq -r .message /tmp/playlog-health.json)
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          title='Playlog automatic sync health alert'
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq 'map(select(.title == "Playlog automatic sync health alert")) | .[0].number // empty')
          if [ "$level" = healthy ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Published snapshot and monitored boundary windows are healthy again."; fi
          elif [ "$level" = error ] || [ "$level" = critical ] || [ "$(jq '.missing|length' /tmp/playlog-health.json)" -gt 0 ] || [ "$(jq -r .capacityWarning /tmp/playlog-health.json)" = true ]; then
            echo "::warning::$message"
            if [ -z "$issue" ]; then
              gh issue create --title "$title" --body "$message" --assignee sonder98
            fi
          else
            echo "::warning::$message"
          fi

      - name: Compare Release and Pages, then recover the failed stage
        if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FAILED: ${{ github.event.workflow_run.name == 'Deploy Playlog' && github.event.workflow_run.conclusion == 'failure' }}
        run: node scripts/recover-sync.mjs /tmp/playlog-published.json
