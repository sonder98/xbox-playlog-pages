# Retain the manual entry point, but never write a stale bootstrap vault to Git.
name: Refresh AU artwork through official Xbox sync
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current official Xbox sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run sync.yml --ref main -f sync_mechanism=manual
