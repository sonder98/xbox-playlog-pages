name: Probe Xbox played activity history (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-xbox-activity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox-record-sync
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore encrypted Microsoft authorization
        uses: actions/cache/restore@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-probe-start
          restore-keys: microsoft-private-v1-main-
      - name: Probe historical played-activity API without logging personal activity
        env:
          MICROSOFT_STATE_KEY: ${{ secrets.MICROSOFT_STATE_KEY }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import {credentials} from './scripts/microsoft-credentials.ts';
          import {microsoftTokenUrl,xboxScopes} from './scripts/microsoft.ts';
          const session=await credentials(process.env);
          const config=session.config;
          const form=new URLSearchParams({client_id:config.clientId,refresh_token:config.refreshToken,grant_type:'refresh_token',scope:xboxScopes});
          if(config.clientSecret)form.set('client_secret',config.clientSecret);
          const safeFetch=async(url,init)=>fetch(url,{redirect:'error',signal:AbortSignal.timeout(22000),...init});
          const oauth=await safeFetch(microsoftTokenUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});
          if(!oauth.ok)throw Error('OAuth refresh status '+oauth.status);
          const tokens=await oauth.json();
          if(!tokens.access_token)throw Error('Missing Xbox access token');
          if(tokens.refresh_token)await config.onRefreshToken?.(tokens.refresh_token);
          const auth=await safeFetch('https://user.auth.xboxlive.com/user/authenticate',{method:'POST',headers:{'Content-Type':'application/json','x-xbl-contract-version':'1'},body:JSON.stringify({RelyingParty:'http://auth.xboxlive.com',TokenType:'JWT',Properties:{AuthMethod:'RPS',SiteName:'user.auth.xboxlive.com',RpsTicket:'d='+tokens.access_token}})});
          if(!auth.ok)throw Error('Xbox user auth status '+auth.status);
          const a=await auth.json();
          const xsts=await safeFetch('https://xsts.auth.xboxlive.com/xsts/authorize',{method:'POST',headers:{'Content-Type':'application/json','x-xbl-contract-version':'1'},body:JSON.stringify({RelyingParty:'http://xboxlive.com',TokenType:'JWT',Properties:{SandboxId:'RETAIL',UserTokens:[a.Token]}})});
          if(!xsts.ok)throw Error('XSTS auth status '+xsts.status);
          const xs=await xsts.json();
          const authorization='XBL3.0 x='+xs.DisplayClaims.xui[0].uhs+';'+xs.Token;
          const headers={Authorization:authorization,'x-xbl-contract-version':'2','Accept-Language':'en-US'};
          const profile=await safeFetch('https://profile.xboxlive.com/users/me/profile/settings?settings=Gamertag',{headers});
          if(!profile.ok)throw Error('Profile identification status '+profile.status);
          const identity=await profile.json();
          const xuid=identity.profileUsers?.[0]?.id;
          if(!xuid||!/^\d{5,25}$/.test(xuid)||(session.state.owner&&session.state.owner!==xuid))throw Error('Account verification failed');
          console.log('PROBE_ACCOUNT validated; no identities or tokens will be logged');
          const base='https://avty.xboxlive.com/users/xuid('+xuid+')/activity/History';
          const calls=[
            ['played_recent',{numItems:'100',activityTypes:'Played',contentTypes:'Game',includeSelf:'true'}],
            ['mixed_recent',{numItems:'60',contentTypes:'Game',includeSelf:'true'}],
            ['played_backfill',{numItems:'100',activityTypes:'Played',contentTypes:'Game',includeSelf:'true',startDate:'2025-01-01T00:00:00Z'}],
          ];
          for(const [name,options]of calls){
            try{
              const url=base+'?'+new URLSearchParams(options);
              const result=await safeFetch(url,{headers});
              if(!result.ok){console.log('PROBE '+name+' HTTP '+result.status);continue;}
              const data=await result.json();
              const items=Array.isArray(data.activityItems)?data.activityItems:[];
              const types={};
              const keys=new Set(),childkeys=new Set();
              let dated=0,durations=0,timedStartEnd=0;
              for(const item of items){
                if(!item||typeof item!=='object')continue;
                const type=String(item.activityItemType??item.activity?.activityItemType??'unknown');
                types[type]=(types[type]||0)+1;
                Object.keys(item).forEach(k=>keys.add(k));
                Object.keys(item.activity||{}).forEach(k=>childkeys.add(k));
                if(item.date||item.activity?.date||item.activity?.dateRecorded)dated++;
                const nested=[...Object.keys(item),...Object.keys(item.activity||{})].join(' ');
                if(/duration|playtime|minutesplayed|timeplayed/i.test(nested))durations++;
                if(/startTime|sessionStart/i.test(nested)&&/endTime|sessionEnd/i.test(nested))timedStartEnd++;
              }
              console.log('PROBE '+name+' '+JSON.stringify({status:result.status,reportedNumItems:data.numItems??null,received:items.length,types,dated,durationFields:durations,sessionStartEndFields:timedStartEnd,hasContinuation:!!(data.contToken||data.continuationToken),topLevelKeys:[...keys].filter(k=>!/xuid|tag|name|title|text|description|image|caption|url|uri|content/i.test(k)).sort().slice(0,35),activityKeys:[...childkeys].filter(k=>!/xuid|tag|name|title|text|description|image|caption|url|uri|content/i.test(k)).sort().slice(0,35)}));
            }catch(err){console.log('PROBE '+name+' error '+(err instanceof Error?err.name:'unknown'));}
          }
          session.save();
          NODE
      - name: Save rotated authorization privately for next sync
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .private/microsoft
          key: microsoft-private-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-probe-end
