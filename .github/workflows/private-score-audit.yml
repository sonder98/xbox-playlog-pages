name: Private title score audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-score-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Restore encrypted game snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-assets.mjs restore-snapshot
      - name: Print encrypted private game list for offline score verification
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NEW_APP_PASSWORD: ${{ secrets.NEW_APP_PASSWORD }}
          MICROSOFT_STATE_KEY: ${{ secrets.MICROSOFT_STATE_KEY }}
        run: node --experimental-strip-types scripts/private-score-audit-export.ts
